# Nginx reverse proxy for Team Portal（参考模板）
#
# 两种使用方式：
# 1. Docker 部署（推荐）：使用 deploy/nginx.prod.conf + docker-compose.prod.yml
#    - nginx 作为容器运行，自动处理证书和域名替换
#    - 首次部署: DOMAIN=xxx EMAIL=xxx bash deploy/init-letsencrypt.sh
#    - 启动: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# 2. 宿主机 nginx（传统方式）：将本文件复制到 /etc/nginx/sites-available/
#    - cp deploy/nginx.conf /etc/nginx/sites-available/team-portal
#    - ln -s /etc/nginx/sites-available/team-portal /etc/nginx/sites-enabled/
#    - 替换 team.yourdomain.com 为实际域名
#    - certbot --nginx -d team.yourdomain.com

server {
    listen 80;
    server_name team.yourdomain.com;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name team.yourdomain.com;

    ssl_certificate     /etc/letsencrypt/live/team.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/team.yourdomain.com/privkey.pem;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Frontend + API proxy
    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Direct backend API access (optional)
    location /api/ {
        proxy_pass http://localhost:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    client_max_body_size 10m;
}
