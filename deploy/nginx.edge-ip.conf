# TeamPortal + ArduPilot Wiki 边缘 nginx（单 IP、Let's Encrypt IP 证书、HTTP/3）
# 由 deploy/enable-tls.sh 的 IP 模式部署；证书路径按 IP 目录：
#   /etc/letsencrypt/live/<IP>/fullchain.pem
# 端口：80 = ACME challenge + 301；443/tcp+h3 = 主站(反代 frontend:3000) + wiki 镜像

# ── HTTP:80：只做 ACME 验证与跳转 ──
server {
    listen 80 default_server;
    server_name _;

    # Let's Encrypt HTTP-01（IP 证书只能走 HTTP-01，续期也依赖这里）
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS:443：主站 + wiki ──
server {
    listen 443 ssl default_server;
    listen 443 quic reuseport;
    http2 on;
    server_name __IP__;

    ssl_certificate     /etc/letsencrypt/live/__IP__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__IP__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    # HTTP/3 0-RTT（浏览器会回退 HTTP/2/1.1）
    ssl_early_data on;

    # 安全头（主站 Next.js 自己也发，这里兜底 wiki 静态页）
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Alt-Svc 'h3=":443"; ma=86400' always;

    client_max_body_size 1024m;
    proxy_read_timeout 1800s;
    proxy_send_timeout 1800s;

    # ── 主站：反代 Next.js 容器（同 docker 网络） ──
    location / {
        proxy_pass http://teamportal-frontend-1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # AI 聊天 SSE 必须不缓冲；长请求由 proxy_read_timeout 兜底
        proxy_buffering off;
    }

    # ── 以下为 ArduPilot 中文镜像站（与 HTTP-only 版本一致） ──
    # 侧边栏子站切换链接是根绝对路径(如 /rover/index.html)
    location ~ ^/(copter|plane|rover|dev|planner|planner2|mavproxy|sub|blimp|antennatracker|ardupilot)(/.*)$ {
        return 302 /ardupilot_wiki/$1/build/html/zh$2;
    }

    location ~ ^/ardupilot_wiki/(?<wiki>[^/]+)/build/html/zh/(?<path>.*)$ {
        alias /data/$wiki.zh/build/html/$path;
        index index.html;

        error_page 404 = @official_fallback;

        sub_filter 'https://ardupilot.org/copter/'          '/ardupilot_wiki/copter/build/html/zh/';
        sub_filter 'https://ardupilot.org/plane/'           '/ardupilot_wiki/plane/build/html/zh/';
        sub_filter 'https://ardupilot.org/rover/'           '/ardupilot_wiki/rover/build/html/zh/';
        sub_filter 'https://ardupilot.org/dev/'             '/ardupilot_wiki/dev/build/html/zh/';
        sub_filter 'https://ardupilot.org/planner/'         '/ardupilot_wiki/planner/build/html/zh/';
        sub_filter 'https://ardupilot.org/planner2/'        '/ardupilot_wiki/planner2/build/html/zh/';
        sub_filter 'https://ardupilot.org/mavproxy/'        '/ardupilot_wiki/mavproxy/build/html/zh/';
        sub_filter 'https://ardupilot.org/sub/'             '/ardupilot_wiki/sub/build/html/zh/';
        sub_filter 'https://ardupilot.org/blimp/'           '/ardupilot_wiki/blimp/build/html/zh/';
        sub_filter 'https://ardupilot.org/antennatracker/'  '/ardupilot_wiki/antennatracker/build/html/zh/';
        sub_filter 'https://ardupilot.org/ardupilot/'       '/ardupilot_wiki/ardupilot/build/html/zh/';
        sub_filter 'https://ardupilot.org/"'                '/ardupilot_wiki/ardupilot/build/html/zh/"';
        sub_filter 'http://ardupilot.org/copter/' '/ardupilot_wiki/copter/build/html/zh/';
        sub_filter 'http://ardupilot.org/plane/' '/ardupilot_wiki/plane/build/html/zh/';
        sub_filter 'http://ardupilot.org/rover/' '/ardupilot_wiki/rover/build/html/zh/';
        sub_filter 'http://ardupilot.org/dev/' '/ardupilot_wiki/dev/build/html/zh/';
        sub_filter 'http://ardupilot.org/planner/' '/ardupilot_wiki/planner/build/html/zh/';
        sub_filter 'http://ardupilot.org/planner2/' '/ardupilot_wiki/planner2/build/html/zh/';
        sub_filter 'http://ardupilot.org/mavproxy/' '/ardupilot_wiki/mavproxy/build/html/zh/';
        sub_filter 'http://ardupilot.org/sub/' '/ardupilot_wiki/sub/build/html/zh/';
        sub_filter 'http://ardupilot.org/blimp/' '/ardupilot_wiki/blimp/build/html/zh/';
        sub_filter 'http://ardupilot.org/antennatracker/' '/ardupilot_wiki/antennatracker/build/html/zh/';
        sub_filter 'http://ardupilot.org/ardupilot/' '/ardupilot_wiki/ardupilot/build/html/zh/';
        sub_filter 'http://ardupilot.org"'                  '/ardupilot_wiki/ardupilot/build/html/zh/"';
        sub_filter 'https://ardupilot.org"'                 '/ardupilot_wiki/ardupilot/build/html/zh/"';
        sub_filter '//ardupilot.org"'                       '/ardupilot_wiki/ardupilot/build/html/zh/"';
        sub_filter_once off;
        sub_filter_types text/html;
    }

    location @official_fallback {
        rewrite ^/ardupilot_wiki/([^/]+)/build/html/zh/(.*)$ https://ardupilot.org/$1/$2 redirect;
    }

    location /ardupilot_wiki/ {
        return 404 "not found\n";
        add_header Content-Type text/plain;
    }
}
