# 最小 nginx 反代（宿主 3000 → frontend:3000），用于让审计拿到真实客户端 IP。
#
# 与 deploy/nginx.prod.conf 的区别：不带 TLS/域名/certbot，只做一层转发，
# 目的是让后端看到「浏览器 → nginx」这一跳，从而拿到真实客户端地址。
#
# ⚠️ X-Forwarded-For 用 $remote_addr（**覆盖**）而不是 $proxy_add_x_forwarded_for（追加）：
#    追加会把客户端自己塞的值保留在链里，虽然后端按"最右一条"取值（ForwardLimit=1）也能挡住伪造，
#    但覆盖更直白——链上只剩 nginx 实际看到的对端地址。

server {
    listen 80;
    server_name _;

    # 与后端 Kestrel / next.config 的 1GB 上限保持一致（大文件上传走这里）
    client_max_body_size 1024m;

    # 固件下载/AI 可能是长请求，别让它被代理掐断
    proxy_read_timeout 1800s;
    proxy_send_timeout 1800s;

    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        # 保留 Upgrade/Connection 以便（未来）WebSocket 类请求不被破坏
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
