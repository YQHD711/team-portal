# Team Portal — 生产环境 Nginx HTTPS 配置
# __DOMAIN__ 会被 init-letsencrypt.sh 替换为实际域名

# HTTP → HTTPS 重定向 + ACME challenge
server {
    listen 80;
    server_name __DOMAIN__;

    # Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS 主站
server {
    # HTTP/3 (QUIC over UDP)：复用同证书,降级浏览器自动回退 HTTP/2
    # Alt-Svc 头让 HTTP/2 客户端发现并升级到 h3
    listen 443 ssl http2;
    listen 443 quic reuseport;
    server_name __DOMAIN__;

    # SSL 证书（Let's Encrypt）
    ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;

    # SSL 优化
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;

    # 启用 HTTP/3 的早期数据（0-RTT），减少 TLS 握手延迟
    ssl_early_data on;

    # 安全头
    # 允许系统内同源 WebTools iframe；跨站嵌入仍由 SAMEORIGIN 阻断
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    # X-XSS-Protection 已弃用,现代浏览器忽略且可能误报,移除
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # HSTS 前端层也下发,首次访问即可声明(后端 HSTS 仅覆盖 /api/* /health)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # 告诉 HTTP/2 客户端：同主机也支持 HTTP/3（h3），max-age 1 天
    add_header Alt-Svc 'h3=":443"; ma=86400' always;
    # HTTP/3 必须以 HTTP/2 形式支持 HTTP/3 Alt-Svc,避免重复 Alt-Svc 头
    quic_gso on;
    quic_retry on;

    # Gzip 压缩
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 1024;
    gzip_vary on;

    client_max_body_size 20m;

    # 前端
    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 后端 API
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Nginx 自身健康检查
    location /health {
        access_log off;
        return 200 "ok";
        add_header Content-Type text/plain;
    }
}
