# 实验室局域网内测配置
# 用法：docker compose -f docker-compose.yml -f docker-compose.lan.yml up -d --build
# 局域网访问：http://192.168.1.10:3000
services:
  frontend:
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      API_PROXY_URL: http://backend:8080

  backend:
    ports: !reset []
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      Cors__Origins: http://192.168.1.10:3000
      CORS__ORIGINS: http://192.168.1.10:3000
      AiService__BaseUrl: http://ai-service:9001
      WebTools__Root: /webtools-content
    volumes:
      - ../ardupilot_log_analysis/WebTools:/webtools-content:ro

  ai-service:
    ports: !reset []
    # AI 只允许 Compose 内部 backend 访问，不映射到宿主机
