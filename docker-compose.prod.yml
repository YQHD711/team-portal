# 生产环境叠加配置 — HTTPS + nginx 反向代理 + Let's Encrypt
# 使用方式: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# 首次部署前先运行: bash deploy/init-letsencrypt.sh

services:
  # ── 覆盖：移除对外端口暴露，仅内部访问 ──
  frontend:
    build:
      context: ./web
      dockerfile: Dockerfile
      target: prod
      args:
        API_PROXY_URL: http://backend:8080
    ports: []
    environment:
      - NODE_ENV=production
      - API_PROXY_URL=http://backend:8080
    networks:
      teamportal-prod:
        ipv4_address: 172.29.0.3

  backend:
    ports: []
    env_file:
      - .env
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - Cors__Origins=https://${DOMAIN:-localhost}
      # 真实客户端 IP 只在 X-Forwarded-For 里；只信任**真正的代理容器**（compose 固定子网 + 静态 IP）：
      #  - nginx   (172.29.0.2)：/api/ 由 nginx 直连 backend，后端看到的对端就是它
      #  - frontend(172.29.0.3 / 172.28.0.2)：Next 服务端 SSR 转发 /api 时对端是它
      #    （两个地址都要列：prod.yml 是 docker-compose.yml 的叠加，服务会同时加入两张网络）
      # ⚠️ 不要退回"信任 172.16.0.0/12 / 10.0.0.0/8"那套：任意私网来源都能伪造 IP（审计 #22）。
      # ForwardLimit=1：只信任最右一条（相邻代理自己写的），客户端在左边伪造多少条都不影响结果。
      - ForwardedHeaders__KnownProxies=${FORWARDEDHEADERS__KNOWNPROXIES:-172.29.0.2;172.29.0.3;172.28.0.2}
      - ForwardedHeaders__ForwardLimit=${FORWARDEDHEADERS__FORWARDLIMIT:-1}
    networks:
      teamportal-prod:
        ipv4_address: 172.29.0.4

  # ── Nginx 反向代理 ──
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN:-localhost}
    volumes:
      - ./deploy/nginx.prod.conf:/etc/nginx/templates/default.conf.template:ro
      - ./certbot/www:/var/www/certbot:ro
      - ./certbot/conf:/etc/letsencrypt:ro
    command: >
      /bin/sh -c "
      sed 's/__DOMAIN__/'$${DOMAIN}'/g' /etc/nginx/templates/default.conf.template > /etc/nginx/conf.d/default.conf &&
      nginx -g 'daemon off;'
      "
    depends_on:
      - frontend
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      teamportal-prod:
        ipv4_address: 172.29.0.2

  # ── Certbot 自动续期 ──
  certbot:
    image: certbot/certbot
    volumes:
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
    entrypoint: >
      /bin/sh -c '
      trap exit TERM;
      while :; do
        certbot renew --quiet;
        sleep 12h & wait $${!};
      done'
    restart: unless-stopped

# 固定子网：KnownProxies 必须能精确指到 nginx / frontend 容器
networks:
  teamportal-prod:
    ipam:
      config:
        - subnet: 172.29.0.0/24
