# 生产环境叠加配置 — HTTPS + nginx 反向代理 + Let's Encrypt
# 使用方式: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# 首次部署前先运行: bash deploy/init-letsencrypt.sh

services:
  # ── 覆盖：移除对外端口暴露，仅内部访问 ──
  frontend:
    ports: []
    environment:
      - NODE_ENV=production
      - API_PROXY_URL=http://backend:8080

  backend:
    ports: []
    env_file:
      - .env
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - Cors__Origins=https://${DOMAIN:-localhost}
      # 信任 docker 内网代理(nginx)的 X-Forwarded-* 头;直接模式(无代理)勿配置此项
      - ForwardedHeaders__KnownNetworks=172.16.0.0/12

  ai-service:
    ports: []

  # ── Nginx 反向代理 ──
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN:-localhost}
    volumes:
      - ./deploy/nginx.prod.conf:/etc/nginx/templates/default.conf.template:ro
      - ./certbot/www:/var/www/certbot:ro
      - ./certbot/conf:/etc/letsencrypt:ro
    command: >
      /bin/sh -c "
      sed 's/__DOMAIN__/'$${DOMAIN}'/g' /etc/nginx/templates/default.conf.template > /etc/nginx/conf.d/default.conf &&
      nginx -g 'daemon off;'
      "
    depends_on:
      - frontend
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ── Certbot 自动续期 ──
  certbot:
    image: certbot/certbot
    volumes:
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
    entrypoint: >
      /bin/sh -c '
      trap exit TERM;
      while :; do
        certbot renew --quiet;
        sleep 12h & wait $${!};
      done'
    restart: unless-stopped
