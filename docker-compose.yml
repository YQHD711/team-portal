services:
  frontend:
    build:
      context: ./web
      dockerfile: Dockerfile
      target: dev
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - API_PROXY_URL=http://backend:8080
    volumes:
      - ./web:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000"]
      interval: 30s
      timeout: 5s
      retries: 3

  backend:
    build:
      context: ./src/TeamPortal
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - AI_SERVICE_URL=http://ai-service:9001
      - AiService__BaseUrl=http://ai-service:9001
      - WebTools__Root=/webtools-content
      - ConnectionStrings__DefaultConnection=Data Source=/data/teamportal.db
      - Cors__Origins=http://localhost:3000
    volumes:
      - ./data:/data
      - ../ardupilot_log_analysis/WebTools:/webtools-content:ro
    depends_on:
      - ai-service
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    ports:
      - "9001:9001"
    environment:
      - DEEPSEEK_API_KEY=${AISERVICE__DEEPSEEKKEY:-}
      - DEEPSEEK_BASE_URL=${AISERVICE__DEEPSEEKBASEURL:-https://api.deepseek.com}
      - TEAMPORTAL_DB_PATH=/data/teamportal.db
    volumes:
      - ./data:/data
      - ./ai-service:/app
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9001/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
