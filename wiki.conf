server {
    listen 80 default_server;
    server_name _;

    # 根路径:重定向到中文站首页(copter)
    location = / {
        return 302 /ardupilot_wiki/copter/build/html/zh/;
    }

    # ArduPilot 多子站中文镜像站
    # 路径:/ardupilot_wiki/{wiki}/build/html/zh/{path}
    # → /data/{wiki}.zh/build/html/{path}    (容器内路径)
    # 挂载: -v /home/admin/ardupilot_wiki_cn:/data:ro
    location ~ ^/ardupilot_wiki/(?<wiki>[^/]+)/build/html/zh/(?<path>.*)$ {
        alias /data/$wiki.zh/build/html/$path;
        index index.html;
    }

    # 其它路径 404(避免暴露其它服务)
    location / {
        return 404 "not found\n";
        add_header Content-Type text/plain;
    }
}